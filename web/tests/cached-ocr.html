<!doctype html><html><body><button id="run">Test cached OCR with external network blocked</button><pre id="result">Ready</pre><script type="module">
import {createWorker,OEM} from 'tesseract.js';document.querySelector('#run').onclick=async()=>{try{const worker=await createWorker('eng',OEM.LSTM_ONLY,{workerPath:'/tests/ocr-offline-worker.js',workerBlobURL:false,corePath:'/ocr-runtime/tesseract-core-lstm.wasm.js',cachePath:'offline-translator-ocr-v1',langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int',errorHandler:()=>{}});const img=new Image();img.src='/tests/fixtures/ocr-en.svg';await img.decode();const canvas=document.createElement('canvas');canvas.width=img.width;canvas.height=img.height;canvas.getContext('2d').drawImage(img,0,0);const started=performance.now();const result=await worker.recognize(canvas.toDataURL('image/png'));document.querySelector('#result').textContent=JSON.stringify({text:result.data.text,confidence:result.data.confidence,inferenceMs:performance.now()-started});await worker.terminate()}catch(error){document.querySelector('#result').textContent=String(error)}};
</script></body></html>
