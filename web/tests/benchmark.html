<!doctype html><html><body><h1>App translation experiment</h1><button id="opus">OPUS English to Vietnamese</button><button id="m2m">M2M English to Vietnamese</button><button id="reverse">OPUS Vietnamese to English</button><pre id="results">Ready</pre><script type="module">
import {translateWithModel,releaseTranslation} from '/src/downloaded-translation.ts';import {modelFor} from '/src/model-options.ts';
const rows=[['I left my bag on the bus.','Tôi để quên túi trên xe buýt.'],['Could I have the bill, please?','Cho tôi xin hóa đơn được không?'],['I do not eat pork.','Tôi không ăn thịt lợn.'],['The bus leaves at 6:30 p.m.','Xe buýt khởi hành lúc 6 giờ 30 tối.'],['Can I pay by card?','Tôi có thể thanh toán bằng thẻ không?']];
for(const mode of ['opus','m2m','reverse'])document.querySelector('#'+mode).onclick=async()=>{const result=[];const model=modelFor(mode==='m2m'?'multilingual':'opus',mode==='reverse'?'vi':'en',mode==='reverse'?'en':'vi');releaseTranslation();for(const row of rows){let metrics;const start=performance.now();try{const input=row[mode==='reverse'?1:0];const output=await translateWithModel(model,input,mode==='reverse'?'vi':'en',mode==='reverse'?'en':'vi',new AbortController().signal,status=>document.querySelector('#results').textContent=JSON.stringify({status,completed:result.length}),value=>metrics=value);result.push({input,output,totalMs:performance.now()-start,...metrics})}catch(error){result.push({error:String(error)})}document.querySelector('#results').textContent=JSON.stringify({model,results:result},null,2)}};
</script></body></html>
