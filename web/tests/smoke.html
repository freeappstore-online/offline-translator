<!doctype html><html><body><h1>Local runtime smoke tests</h1><button id="ocr-en">OCR English</button><button id="ocr-vi">OCR Vietnamese</button><button id="ocr-zh">OCR Chinese</button><button id="speech">Speech English</button><button id="speech-vi">Speech Vietnamese</button><button id="speech-zh">Speech Chinese</button><pre id="result">Ready</pre><script type="module">
import {recognizeImage} from '/src/ocr-engine.ts';import {transcribeSpeech} from '/src/speech-engine.ts';
const output=document.querySelector('#result');for(const language of ['en','vi','zh'])document.querySelector('#ocr-'+language).onclick=async()=>{try{output.textContent='Running '+language;const img = new Image();img.src='/tests/fixtures/ocr-'+language+'.svg';await img.decode();const canvas=document.createElement('canvas');canvas.width=img.width;canvas.height=img.height;canvas.getContext('2d').drawImage(img,0,0);const result=await recognizeImage(canvas.toDataURL('image/png'),language,new AbortController().signal,(status,progress)=>output.textContent=JSON.stringify({status,progress}));output.textContent=JSON.stringify(result)}catch(error){output.textContent=String(error)}};
document.querySelector('#speech').onclick=async()=>{try {output.textContent='Loading public fixture';const context=new AudioContext({sampleRate:16000});const audio=await context.decodeAudioData(await(await fetch('https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/jfk.wav')).arrayBuffer());const samples=audio.getChannelData(0).slice();await context.close();const result=await transcribeSpeech(samples,'en',new AbortController().signal,status=>output.textContent=status);output.textContent=JSON.stringify(result)}catch(error){output.textContent=String(error)}};
for(const language of ['vi','zh'])document.querySelector('#speech-'+language).onclick=async()=>{try{const context=new AudioContext({sampleRate:16000});const buffer=await context.decodeAudioData(await(await fetch('/tests/fixtures/speech-'+language+'.wav')).arrayBuffer());const samples=buffer.getChannelData(0).slice();await context.close();const result=await transcribeSpeech(samples,language,new AbortController().signal,status=>output.textContent=status);output.textContent=JSON.stringify(result)}catch(error){output.textContent=String(error)}};
</script></body></html>
